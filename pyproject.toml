[project]
name = "fagus-crenata-masting-jp-2026-06"
version = "0.1.0"
description = "Frozen copy of the Dryad dataset on seed production of Fagus crenata at 102 sites in northern Japan (Masaki et al.)"
requires-python = ">=3.12"
dependencies = ["huggingface-hub>=2.2.0", "pyarrow>=26.0.0"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
